<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | LeeAnn's Cookies</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Admin CSS -->
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<main class="admin-page">
  <!-- Login View -->
  <section class="admin-login-view" id="loginView">
    <div class="admin-login-card">
      <div class="text-center mb-4">
        <p class="admin-eyebrow mb-2">Admin</p>
        <h1 class="h3 fw-semibold mb-2">LeeAnn’s Cookies</h1>
        <p class="text-secondary mb-0">Sign in to manage site content.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            class="form-control form-control-lg"
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
          <div class="invalid-feedback">Please enter your username.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-control form-control-lg"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <div class="invalid-feedback">Please enter your password.</div>
        </div>

        <button class="btn btn-dark btn-lg w-100" id="loginBtn" type="submit">
          Sign In
        </button>

        <div class="admin-status mt-3" id="loginStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <!-- Admin View -->
  <section class="admin-editor-view" id="editorView" hidden>
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow mb-1">Admin</p>
        <h1 class="h3 fw-semibold mb-0">Manage LeeAnn’s Cookies</h1>
      </div>

      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small" id="adminUser"></span>
        <button class="btn btn-outline-dark" id="logoutBtn" type="button">
          Logout
        </button>
      </div>
    </header>

    <section class="admin-section">
      <div class="admin-section-heading">
        <div>
          <p class="admin-eyebrow mb-2">Pricing</p>
          <h2 class="h4 fw-semibold mb-1">Cookie Sets</h2>
          <p class="text-secondary mb-0">Update set quantities and prices shown on the public website.</p>
        </div>
      </div>

      <div class="admin-pricing-grid" id="adminPricingGrid"></div>

      <div class="admin-status mt-3" id="editorStatus" role="status" aria-live="polite"></div>
    </section>

    <div class="admin-actions" id="adminActions" hidden>
      <button class="btn btn-outline-dark btn-lg" id="revertChangesBtn" type="button">
        Revert Changes
      </button>
      <button class="btn btn-dark btn-lg" id="saveChangesBtn" type="button">
        Save Changes
      </button>
    </div>
  </section>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Admin JS -->
<script src="admin.js"></script>
</body>
</html>
